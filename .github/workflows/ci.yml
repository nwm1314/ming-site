name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type and content check
        run: pnpm check

      - name: Build Astro site and Pagefind index
        run: pnpm build

      - name: Validate content quality
        run: pnpm test:content

      - name: Check generated internal links
        run: pnpm test:links

      - name: Check media sizes
        run: pnpm test:media

      - name: Verify privacy boundaries
        run: pnpm test:privacy

      - name: Run deterministic release smoke test
        run: pnpm test:release

      - name: Run Cloudflare Static Assets routing smoke test
        run: pnpm test:cf

      - name: Install Chromium for smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run automated smoke tests
        run: pnpm test
